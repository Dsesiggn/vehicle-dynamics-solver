<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suspension Studio · Model tests</title><style>body{font:14px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#faf8fa;color:#48364b}li{padding:7px}.pass{color:#3d7751}.fail{color:#b33550}h1{font-size:24px}</style><h1>Suspension Studio · Model & solver regression tests</h1><p id="summary">Running…</p><ol id="results"></ol><script type="module">import {runChecks} from './checks.js';const results=runChecks();for(const result of results){const li=document.createElement('li');li.className=result.ok?'pass':'fail';li.textContent=`${result.ok?'PASS':'FAIL'} · ${result.name}${result.error?' — '+result.error:''}`;document.getElementById('results').append(li);}document.getElementById('summary').textContent=`${results.filter(r=>r.ok).length} / ${results.length} checks passed`;</script></html>
